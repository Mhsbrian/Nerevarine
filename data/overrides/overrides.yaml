# Hand-curated rules that encode the spreadsheet's prose instructions as
# machine-readable operations. Matched rules clear the "comment not encoded"
# problem for their row; `mri-curation emit` re-reports whatever remains.
#
# Rule vocabulary:
#   match:      { slug | nexusId | csvRow | name }   (AND-combined)
#   skip:       true + skipReason
#   set:        { id,name,extractTo,directUrl,nexusFileId,dataPaths,content,groundcover,bsaArchives,tags }
#   actions:    [{ type: remove|rename|copy|clean, path|paths|src|dst|force|arguments }]
#   moveAfter / moveBefore:  <anchor slug>
#   splitInto:  [ set-specs ]      (replaces one row with several entries)
#   constraints: [{ contentBefore | contentAfter: <plugin name> }]
#   pickFile:   { nameContains | category }   (documents a file choice; silences low-confidence flag)

version: 1
rules:
  # ── Rows that describe the *workflow*, not mods. Our installer replaces all of them. ──
  - match: { slug: use-mod-organizer-2 }
    skip: true
    skipReason: "MO2 is not used — umo + generated openmw.cfg replace the whole MO2/OpenMW-Player workflow."

  - match: { slug: openmw-0-49-dev-build }
    skip: true
    skipReason: "OpenMW itself is installed by the tooling step (0.51 stable ≥ the 0.49-dev this list targeted)."

  - match: { slug: integrate-openmw-with-steam }
    skip: true
    skipReason: "Optional Steam-overlay cosmetics; out of scope for v1."

  - match: { slug: kezyma-s-openmw-player-for-mod-organizer-2 }
    skip: true
    skipReason: "MO2 plugin — no MO2 in this pipeline."

  - match: { slug: delta-plugin }
    skip: true
    skipReason: "Shipped and run automatically as tooling (delta-merge step)."

  - match: { slug: plox-load-order-sorter }
    skip: true
    skipReason: "Load order is baked into the curated list; no runtime sorting."

  # ── Duplicate spreadsheet rows (same mod listed twice in NEW MODS). ──
  - match: { slug: scalable-dwemer-puzzle-box-randomizer-2 }
    skip: true
    skipReason: "Duplicate of csv row 521 (same mod listed twice)."

  - match: { slug: openmw-simply-crafting-2 }
    skip: true
    skipReason: "Duplicate of the earlier OpenMW Simply Crafting row."

  - match: { slug: openmw-crafting-framework-2 }
    skip: true
    skipReason: "Duplicate of the earlier OpenMW Crafting Framework row."

  - match: { slug: sm-masque-clavicus-vile-replacer-2 }
    skip: true
    skipReason: "Duplicate of the earlier SM Masque of Clavicus Vile row."

  # ── Dead hosts (probed 2026-08-10: connection refused / project made private).
  #    Field-confirmed: umo cannot download any of these. Skipped until M2
  #    finds mirrors (candidates: Nexus re-uploads, Wayback snapshots). ──
  - match: { slug: traveling-merchants }
    skip: true
    skipReason: "mw.modhistory.com is dead (connect timeout) — needs a mirror."

  - match: { slug: khajiit-head-replacer }
    skip: true
    skipReason: "mw.modhistory.com is dead (connect timeout) — needs a mirror."

  - match: { slug: mesh-fix }
    skip: true
    skipReason: "mw.modhistory.com is dead (connect timeout) — needs a mirror."

  - match: { slug: westly-s-unique-winged-twilight }
    skip: true
    skipReason: "fliggerty.com is dead (connect timeout) — needs a mirror."

  - match: { slug: transmog-menu-openmw }
    skip: true
    skipReason: "s3ctors-s3cret-st4sh gitlab project is now private (403) — needs a mirror."

  - match: { slug: luamics-openmw-mimic-spawner }
    skip: true
    skipReason: "s3ctors-s3cret-st4sh gitlab project is now private (403) — needs a mirror."

  - match: { slug: openmw-chim-climbing }
    skip: true
    skipReason: "s3ctors-s3cret-st4sh gitlab project is now private (403) — needs a mirror."

  # ── Example prose-rule encodings (patterns for the M2 curation pass). ──

  # "Individual. Delete bcsounds.esp, maser_inex.esp" — archive inspection
  # (2026-08-11) shows a BAIN layout ("02 bitter coast sounds/bcsounds.esp", …):
  # the instruction means VARIANT SELECTION, not deletion. Honored at M2 by
  # simply never adding those folders as data paths. No file actions needed.
  - match: { slug: official-plugins-unofficial-patch }

  # "Load before Patch for Purist, Version 1.3" — the spreadsheet row order
  # already satisfies this; the constraint makes it an enforced invariant.
  - match: { slug: expansion-delay }
    constraints:
      - contentBefore: "Patch for Purists.esm"

  # "Remove Vivec.esp" — archive inspection (2026-08-11): the archive ships
  # VoicedVivec.ESP + YaketyYagrum.ESP only; no Vivec.esp exists to remove.
  - match: { slug: voiced-vivec-and-yakety-yagrum }

  # ── Sync-breakers found by the first full run (umo refuses to download
  #    ANYTHING until every mod's metadata sync succeeds, so these block all). ──
  - match: { slug: go-home-locking-doors }
    skip: true
    skipReason: "Sub-page of the go-home gitlab project with no package of its own — umo sync permanently incomplete (field-verified). Fold into go-home or find artifact URL in M2."

  - match: { slug: omw-achievements }
    skip: true
    skipReason: "caz1que.gitlab.io page has no resolvable gitlab package — umo sync permanently incomplete (field-verified)."

  # ── Page-URL stragglers from full run 3 (the URL is a webpage, not a file;
  #    each needs a real artifact URL or mirror in M2). ──
  - match: { slug: economy-fixes-v1-0-item-list-only }
    skip: true
    skipReason: "Wayback-archived modhistory PAGE, not a file — needs the snapshot's direct download URL."

  - match: { slug: thief-experience-overhaul }
    skip: true
    skipReason: "Wayback-archived modhistory PAGE, not a file — needs the snapshot's direct download URL."

  - match: { slug: simple-sleeping }
    skip: true
    skipReason: "Mediafire landing page — needs a direct mirror."

  - match: { slug: balmora-underworld-bcom-esp }
    skip: true
    skipReason: "Dropbox link no longer serves the file (probed) — needs a fresh mirror."

  - match: { slug: balmora-underworld-nav-point-fix }
    skip: true
    skipReason: "modding-openmw.com mod PAGE — needs the real artifact URL."

  - match: { slug: tyddy-s-landscape-retexture }
    skip: true
    skipReason: "fullrest.ru file PAGE — needs the real artifact URL."

  - match: { slug: s3lightfixes }
    skip: true
    skipReason: "Tool, not a mod — already shipped in the MOMW tools pack."

  # ══ Variant picks (human layer, 2026-08-11) — each pick cites its basis. ══

  # WRONG FILE PINNED: both BCOM rows resolved to the Patches archive. Re-pin
  # the main row to "Beautiful Cities of Morrowind - BCOM Core" 3.3.0.
  - match: { slug: beautiful-cities-of-morrowind }
    set:
      nexusFileId: 1000062828

  # BCOM Patches: numbered folders matched against mods present in this list
  # (Waterworks variants skipped — Balmora Waterworks edition not installed;
  # TOTSP boat patch included because both Abot's Boats and TOTSP are in-list).
