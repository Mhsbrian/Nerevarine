    set:
      dataPaths: ["BCOMPatches/01 Patch for Purists", "BCOMPatches/02 Red Mountain Reborn", "BCOMPatches/03 OAAB Foyada Mamaea", "BCOMPatches/07 Rise of House Telvanni 2.0", "BCOMPatches/09 Magical Missions", "BCOMPatches/10 Concept Art Plantations", "BCOMPatches/11 Imperial Legion Expansion", "BCOMPatches/14 Master Index Redux", "BCOMPatches/17 GITD Telvanni Dormers", "BCOMPatches/18 Abots Boats - activate both esp", "BCOMPatches/19 Abot's boats patch for Tomb of the Snow Prince", "BCOMPatches/22 Tamriel Rebuilt patch", "BCOMPatches/25 Province Cyrodiil Patch", "BCOMPatches/27 Ebonheart Underworks", "BCOMPatches/29 Yet Another Guard Diversity - Regular", "BCOMPatches/30 Morrowind Anticheese", "BCOMPatches/32 Apartments of Morrowind", "BCOMPatches/39 Ashlander Traders Remastered", "BCOMPatches/43 Uvirith Legacy Patch", "BCOMPatches/55 Guild of Vampire hunters", "BCOMPatches/56 Dartboards expanded", "BCOMPatches/59 Redoran Patrols", "BCOMPatches/73 Store Entrance Chimes", "BCOMPatches/76 High Art", "BCOMPatches/80 Mamaea Awakened", "BCOMPatches/85 Logs on fire"]

