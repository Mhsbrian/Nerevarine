  # ── Example prose-rule encodings (patterns for the M2 curation pass). ──

  # "Individual. Delete bcsounds.esp, maser_inex.esp" — archive inspection
  # (2026-08-11) shows a BAIN layout ("02 bitter coast sounds/bcsounds.esp", …):
  # the instruction means VARIANT SELECTION, not deletion. Honored at M2 by
  # simply never adding those folders as data paths. No file actions needed.
  - match: { slug: official-plugins-unofficial-patch }

  # "Load before Patch for Purist, Version 1.3" — the spreadsheet row order
  # already satisfies this; the constraint makes it an enforced invariant.
  - match: { slug: expansion-delay }
    constraints:
      - contentBefore: "Patch for Purists.esm"

  # "Remove Vivec.esp" — archive inspection (2026-08-11): the archive ships
  # VoicedVivec.ESP + YaketyYagrum.ESP only; no Vivec.esp exists to remove.
  - match: { slug: voiced-vivec-and-yakety-yagrum }

