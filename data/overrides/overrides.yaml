  # folders; both patch targets are in-list.
  - match: { slug: project-atlas }
    set:
      dataPaths: ["ProjectAtlas/00 BATs", "ProjectAtlas/00 Core", "ProjectAtlas/01 Textures - Vanilla", "ProjectAtlas/06 Glow in the Dahrk Patch", "ProjectAtlas/07 Graphic Herbalism Patch"]

  # Aesthesia Groundcover (richest): core meshes + HD textures + grass plugin
