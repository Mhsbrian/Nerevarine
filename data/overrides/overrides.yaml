  # activation planner routes these esps to groundcover= lines.
  - match: { slug: aesthesia-groundcover-reworked }
    set:
      dataPaths: ["AesthesiaGroundcoverReworked/00 Core", "AesthesiaGroundcoverReworked/01 Textures - HD", "AesthesiaGroundcoverReworked/02 Plugins - Vanilla Regions", "AesthesiaGroundcoverReworked/02 Plugins - TR"]

