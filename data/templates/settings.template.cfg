# Morrowind Remake Installer — tuned settings.cfg template.
#
# Only the keys listed here are overlaid onto the user's settings.cfg; every
# other setting they already have is preserved. Values follow the reference
# "remaster" tuning (distant land, shader lighting, shadows, groundcover) at
# levels a mid-range GPU handles comfortably. Users can still change anything
# in OpenMW's in-game settings afterwards.

[Camera]
viewing distance = 49152
field of view = 60
reverse z = true

[Terrain]
distant terrain = true
object paging = true
object paging active grid = true
composite map resolution = 512

[Shaders]
force shaders = true
lighting method = shaders
max lights = 16
soft particles = true
antialias alpha test = true
auto use object normal maps = true
auto use object specular maps = true
auto use terrain normal maps = true
auto use terrain specular maps = true

[Shadows]
enable shadows = true
number of shadow maps = 3
shadow map resolution = 2048
maximum shadow map distance = 4096
enable indoor shadows = true
actor shadows = true
object shadows = true
terrain shadows = true
percentage closer filtering = 1

[Water]
shader = true
refraction = true
reflection detail = 3
rain ripple detail = 1

[Groundcover]
enabled = true
density = 1.0
rendering distance = 6144.0
stomp mode = 2
stomp intensity = 1

[Post Processing]
enabled = true
transparent postpass = true
chain = ssao_hq,underwater_interior_effects,underwater_effects,clouds,godrays,hdr,FollowerAA,war_adjustments

[Cells]
preload enabled = true
preload distance = 1200

[Map]
allow zooming = true

[GUI]
stretch menu background = true

[Game]
show melee info = true
show projectile damage = true
show effect duration = true
graphic herbalism = true
smooth animation transitions = true
